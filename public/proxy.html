<!doctype html>
<html>
  <head>
    <title>SkillsMP Proxy</title>
  </head>
  <body>
    <div id="status">Proxy Ready</div>
    <script type="module">
      import {
        listen,
        emit,
      } from 'https://unpkg.com/@tauri-apps/api@alpha/event.js'
      import { getCurrentWebviewWindow } from 'https://unpkg.com/@tauri-apps/api@alpha/webviewWindow.js'

      const appWindow = getCurrentWebviewWindow()

      // Listen for fetch requests
      listen('proxy-request', async (event) => {
        const { url, apiKey, reqId } = event.payload
        document.getElementById('status').innerText = `Fetching: ${url}`

        try {
          const response = await fetch(url, {
            headers: {
              Authorization: `Bearer ${apiKey}`,
            },
          })

          if (response.status === 403) {
            // Possible Cloudflare challenge
            document.getElementById('status').innerText =
              'Cloudflare Challenge Detected!'
            await appWindow.show()
            await appWindow.setFocus()
            emit('proxy-challenge', { reqId })
            return
          }

          const data = await response.json()
          emit('proxy-response', { reqId, data, success: true })
        } catch (err) {
          emit('proxy-response', { reqId, error: err.message, success: false })
        }
      })
    </script>
  </body>
</html>
